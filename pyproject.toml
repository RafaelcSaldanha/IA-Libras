
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-tracking"
version = "0.1.0"
description = "Reusable hand tracking system using MediaPipe and OpenCV"
requires-python = ">=3.10"
dependencies = [
    "mediapipe"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hand_tracking = ["models/*.task"]